services:
  db:
    image: postgres:17-alpine
    container_name: customs-converter-db-prod
    restart: unless-stopped
    # Bind only to local loopback interface for local backup access, blocking external network access
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-customs_converter_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-customs_converter_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-customs_converter_user} -d ${DB_NAME:-customs_converter_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customs-converter-app-prod
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-customs_converter_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-customs_converter_db}
      BOT_API_KEY: ${BOT_API_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://cal.tummy.cc}
      NODE_ENV: production
      PORT: 3000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://cal.tummy.cc}
    command: sh -c "npx prisma migrate deploy && node server-dist/index.js"

  proxy:
    image: nginx:alpine
    container_name: customs-converter-proxy-prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5009}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  postgres_prod_data:
